services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aarambh360-postgres
    restart: unless-stopped
    ports:
      - '5433:5432' # host 5433 avoids conflict with other local Postgres containers
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aarambh360
    volumes:
      - aarambh360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aarambh360']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: aarambh360-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aarambh360_pgdata:

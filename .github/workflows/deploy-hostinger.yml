name: Deploy Aarambh360 Web & Blog to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-hostinger.yml'
      - 'pnpm-lock.yaml'

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: 📥 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: ⚡ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Web Portal (Static Export)
        run: pnpm --filter @aarambh360/web build

      - name: 🧹 Clean & Sanitize FTP Hostname
        shell: bash
        run: |
          RAW_SERVER="${{ secrets.HOSTINGER_FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*://||' -e 's|:[0-9]*$||' -e 's|/.*$||' | xargs)
          echo "FTP_HOST=$CLEAN_SERVER" >> $GITHUB_ENV

      - name: 🚀 Sync & Deploy to Hostinger via LFTP
        shell: bash
        env:
          FTP_HOST: ${{ env.FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" << 'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow true
          set ftp:passive-mode true
          mirror -R --verbose --parallel=4 apps/web/out/ ./
          bye
          EOF
